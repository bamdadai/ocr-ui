services:
  # -------------------------
  # Infrastructure Services
  # -------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ocr_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ocr_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ocr_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15674:15672"  # Bind to localhost only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - ocr_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------
  # Application Services
  # -------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        REQ_FILE: requirements/api.txt
        CONFIG_FILE: master_config.gpu.json
    container_name: ocr_api
    restart: unless-stopped
    working_dir: /app
    command: gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8084
    ports:
      - "8000:8084"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  # ===================================
  # GPU-Enabled Celery Workers (Separated)
  # ===================================

  worker-dispatch:
    build:
      context: .
      dockerfile: Dockerfile.worker-cpu
      args:
        REQ_FILE: requirements/worker-cpu.txt
    container_name: ocr_worker_dispatch
    restart: unless-stopped
    working_dir: /app
    command: python -m celery -A app.worker.celery_app worker -l info -Q dispatch -c 1
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./weights:/app/weights:ro
      - ./debug:/app/debug
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  worker-ocr:
    build:
      context: .
      dockerfile: Dockerfile.worker-gpu
      args:
        REQ_FILE: requirements/worker-gpu.txt
    container_name: ocr_worker_ocr
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    command: python -m celery -A app.worker.celery_app worker -l info -Q ocr_pipeline -c 1
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./weights:/app/weights:ro
      - ./debug:/app/debug
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  worker-webhooks:
    build:
      context: .
      dockerfile: Dockerfile.worker-cpu
      args:
        REQ_FILE: requirements/worker-cpu.txt
    container_name: ocr_worker_webhooks
    restart: unless-stopped
    working_dir: /app
    command: python -m celery -A app.worker.celery_app worker -l info -Q webhooks -c 8
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./weights:/app/weights:ro
      - ./debug:/app/debug
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  # ===================================
  # Object Storage (MinIO) for Large Files
  # ===================================

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1

    container_name: ocr_minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"    # MinIO API
      - "127.0.0.1:9001:9001"    # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin2025
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ocr_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s


networks:
  ocr_network:
    driver: bridge
    name: ocr_production_network

volumes:
  redis_data:
  rabbitmq_data:
  minio_data:
