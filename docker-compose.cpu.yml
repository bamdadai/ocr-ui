services:
  # -------------------------
  # Infrastructure Services
  # -------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ocr_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ocr_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ocr_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15674:15672"  # Bind to localhost only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - ocr_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------
  # Application Services
  # -------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      pull: false
      args:
        REQ_FILE: requirements/api.txt
        CONFIG_FILE: master_config.cpu.json
    pull_policy: never
    container_name: ocr_api
    restart: unless-stopped
    working_dir: /app
    command: gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8084
    ports:
      - "8000:8084"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  # ===================================
  # CPU-Only Celery Workers (Separated)
  # ===================================

  worker-dispatch:
    build:
      context: .
      dockerfile: Dockerfile.worker-cpu
      pull: false
      args:
        REQ_FILE: requirements/worker-cpu.txt
    pull_policy: never
    container_name: ocr_worker_dispatch
    restart: unless-stopped
    working_dir: /app
    command: python -m celery -A app.worker.celery_app worker -l info -Q dispatch -c 1
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./weights:/app/weights:ro
      - ./debug:/app/debug
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  worker-ocr:
    build:
      context: .
      dockerfile: Dockerfile.worker-cpu
      pull: false
      args:
        REQ_FILE: requirements/worker-cpu.txt
    pull_policy: never
    container_name: ocr_worker_ocr
    restart: unless-stopped
    working_dir: /app
    command: python -m celery -A app.worker.celery_app worker -l info -Q ocr_pipeline -c 1
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./weights:/app/weights:ro
      - ./debug:/app/debug
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network

  worker-webhooks:
    build:
      context: .
      dockerfile: Dockerfile.worker-cpu
      pull: false
      args:
        REQ_FILE: requirements/worker-cpu.txt
    pull_policy: never
    container_name: ocr_worker_webhooks
    restart: unless-stopped
    working_dir: /app
    command: python -m celery -A app.worker.celery_app worker -l info -Q webhooks -c 8
    env_file: .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./weights:/app/weights:ro
      - ./debug:/app/debug
      - ./logs:/app/logs
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - ocr_network


networks:
  ocr_network:
    driver: bridge
    name: ocr_production_network

volumes:
  redis_data:
  rabbitmq_data:
